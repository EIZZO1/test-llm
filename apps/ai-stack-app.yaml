apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-ai-lightspeed-stack
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/EIZZO1/test-llm.git'
    targetRevision: main
    path: manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /spec/startingCSV
        - /status
    - group: operators.coreos.com
      kind: ClusterServiceVersion
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
        - /spec/install
        - /status
    - group: ols.openshift.io
      kind: OLSConfig
      jsonPointers:
        - /status
        - /spec/audit
        - /spec/ols/conversationCache
        - /spec/ols/userDataCollection
        - /spec/olsDataCollector
        - /spec/ols/deployment/agenticConsole
        - /spec/ols/deployment/alertsAdapter
        - /spec/ols/deployment/console
        - /spec/ols/deployment/dataCollector
        - /spec/ols/deployment/database
        - /spec/ols/deployment/mcpServer
        - /spec/ols/deployment/otelCollector
        - /spec/ols/deployment/rhokp/replicas
