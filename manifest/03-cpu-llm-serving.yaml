---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-cpu-serving
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: llama-cpp-cpu-runtime
  namespace: llm-cpu-serving
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: "Llama.cpp CPU OpenAI Runtime"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  supportedModelFormats:
    - name: gguf
      version: "1"
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      # Officieel llama.cpp server image met ingebouwde OpenAI-compatibele API
      image: ghcr.io/ggerganov/llama.cpp:server
      args:
        - --model
        - /models/model.gguf
        - --ctx-size
        - "4096"
        - --host
        - "0.0.0.0"
        - --port
        - "8080"
        - --threads
        - "8" # Pas aan naar het aantal fysieke CPU cores dat je wilt toewijzen
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: model-volume
          mountPath: /models
      resources:
        requests:
          cpu: "4"
          memory: "6Gi"
        limits:
          cpu: "8"
          memory: "8Gi"
  volumes:
    - name: model-volume
      emptyDir: {}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: cpu-llm
  namespace: llm-cpu-serving
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # We gebruiken RawDeployment zodat Knative de CPU-pod niet naar 0 schaalt (voorkomt cold-start timeouts in Lightspeed)
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: gguf
      runtime: llama-cpp-cpu-runtime
    # InitContainer haalt automatisch een lichtgewicht GGUF model op bij het starten van de pod
    initContainers:
      - name: download-gguf-model
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command:
          - /bin/sh
          - -c
          - |
            if [ ! -f /models/model.gguf ]; then
              echo "Downloading Qwen2.5-1.5B-Instruct GGUF for CPU testing..."
              curl -L -o /models/model.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
            fi
        volumeMounts:
          - name: model-volume
            mountPath: /models