---
apiVersion: v1
kind: Secret
metadata:
  name: cpu-llm-api-key
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  # Dummy key: verplicht veld voor OLS, maar onze lokale CPU-server negeert authenticatie
  apitoken: "sk-local-cpu-testing-key-12345"
---
apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  llm:
    providers:
      - name: local-openshift-ai-cpu
        type: openai
        # De interne KServe Service URL van onze RawDeployment uit Wave 3 (Service poort 80 stuurt door naar pod 8080)
        url: "http://cpu-llm-predictor.llm-cpu-serving.svc.cluster.local/v1"
        credentialsSecretRef:
          name: cpu-llm-api-key
        models:
          - name: model.gguf
  ols:
    defaultModel: model.gguf
    defaultProvider: local-openshift-ai-cpu
    logLevel: INFO
    deployment:
      replicas: 1
      rhokp:
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
            ephemeral-storage: 1Gi
